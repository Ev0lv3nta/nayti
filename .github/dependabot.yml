version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      android-build:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin.*"
          - "com.google.devtools.ksp"
      androidx:
        patterns:
          - "androidx.*"
    ignore:
      # Toolchain migrations are reviewed separately from a release train.
      # Patch updates remain eligible for Dependabot PRs.
      - dependency-name: gradle-wrapper
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "org.jetbrains.kotlin.*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # The Maven coordinate must stay aligned with the reviewed reduced AAR.
      - dependency-name: com.microsoft.onnxruntime:onnxruntime-android
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
